[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "hnr-kanban"
version = "0.1.0"
description = "Python SDK for HNR Kanban — agent-first task coordination"
readme = "README.md"
license = "MIT"
requires-python = ">=3.8"
authors = [{name = "Humans Not Required"}]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Office/Business :: Scheduling",
    "Intended Audience :: Developers",
]

[project.urls]
Homepage = "https://github.com/Humans-Not-Required/kanban"
Repository = "https://github.com/Humans-Not-Required/kanban"
Documentation = "https://github.com/Humans-Not-Required/kanban/tree/main/sdk/python"

[tool.setuptools]
py-modules = ["kanban"]
